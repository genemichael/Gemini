; PlatformIO Project Configuration File for Meshpunk
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = meshpunk

[env:meshpunk]
platform = espressif32@6.11.0
board = T-Deck
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_flags = 
    -DESP32
    -DMESH_PLATFORM
    -DARDUINO_PLATFORM
    -DBOARD_HAS_PSRAM=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DUSE_FSPI_PORT
    -mlongcalls
    -Wno-error=maybe-uninitialized
    -Ilib/MeshCore/src
    -Ilib/MeshCore/lib/ed25519
    -Isrc
    -D RADIO_CLASS=CustomSX1262
    -D WRAPPER_CLASS=CustomSX1262Wrapper
    -D MAX_CONTACTS=500
    -D MAX_GROUP_CHANNELS=20
    -D LORA_FREQ=910.525
    -D LORA_BW=62.5
    -D LORA_SF=7
    -D LORA_TX_POWER=20
    -D PIN_VBAT_READ=4
    ; BLE companion app support (MeshCore companion protocol over BLE)
    -D BLE_COMPANION_ENABLED=1
    -D BLE_PIN_CODE=123456
    -D BLE_NAME_PREFIX=\"MeshPunk\"
    -D MAX_LORA_TX_POWER=20
    -D BLE_DEBUG_LOGGING=0
    -D OFFLINE_QUEUE_SIZE=16
    ; Dual-core refactor: Arduino loop() runs on Core 0 (UI domain),
    ; mesh_task pinned to Core 1 (radio domain) from meshpunk_tasks.cpp.
    -DARDUINO_RUNNING_CORE=0
    -DCONFIG_ARDUINO_RUNNING_CORE=0
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; ---- Hybrid phone: embedded Pyxis core (Reticulum/LXMF over WiFi) ----
    ; Flag group ported from ../pyxis/platformio.ini — each encodes a solved
    ; bug (see its comment blocks + docs/hybrid/HYBRID_PLAN.md D8). Do not
    ; change without architect sign-off.
    -std=gnu++17
    ; RNS allocations + path table into PSRAM (2MB TLSF pool) so they never
    ; compete with LVGL/Lua/WiFi for the 320KB internal SRAM.
    -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR
    -DRNS_CONTAINER_ALLOCATOR=RNS_PSRAM_POOL_ALLOCATOR
    -DRNS_PSRAM_POOL_BUFFER_SIZE=2048000
    ; LittleFS-backed path persistence with a bounded live set. The data
    ; partition is already labeled "spiffs" = microStore's default label.
    -DRNS_USE_FS
    -DRNS_PERSIST_PATHS
    -DUSTORE_USE_LITTLEFS
    -DUSTORE_DEFAULT_MAX_RECS=400
    ; microreticulum-shim: fork-only overlay files required to build
    ; microReticulum on Arduino/ESP32 (allocators, streams, FS glue).
    -Ilib/microreticulum-shim
    -DBZ_NO_STDIO
    ; M3 voice: codec2 codebooks in flash (.const) — without these,
    ; ~127KB of tables land in BSS and compete with LVGL/Lua for
    ; internal SRAM (ported from pyxis platformio.ini).
    -D__EMBEDDED__
    -DMEMORY_CRITICAL

; Strip the platform's default `-DARDUINO_RUNNING_CORE=1` etc. BEFORE our
; build_flags add them back as =0. Without this the command-line sees both
; definitions and gcc warns on every compilation unit.
build_unflags =
    -fno-tree-switch-conversion
    -DARDUINO_RUNNING_CORE=1
    -DCONFIG_ARDUINO_RUNNING_CORE=1
    ; microReticulum needs C++17; strip the platform default first.
    -std=gnu++11

; LDF mode stays at the DEFAULT (`chain`). Two constraints meet here:
; (1) pyxis's duplicate-microReticulum trap came from `deep+` scanning —
; never use deep modes; the git pins below are the single source for
; each micro* lib. (2) `chain+` (preprocessor-evaluating variant) broke
; the framework SD_MMC lib's FS.h resolution in THIS tree (2026-07-22),
; so we keep plain `chain`. See HYBRID_PLAN.md D8.

board_build.partitions = meshpunk_custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

; Libraries path for both local libs and TDeck example libs
lib_extra_dirs =
    ${PROJECT_DIR}/lib

; meshpunk's vendored lib/es7210 ("ES7210") was always dead code and
; exports the same non-namespaced symbols as the ACTIVE ES7210 driver
; inside lib/lxst_audio — linking both is a duplicate-symbol error.
; Kept on disk (small upstream diff), excluded from every build.
lib_ignore = ES7210

; Deps
lib_deps =
  adafruit/RTClib
  adafruit/Adafruit BusIO
  densaugeo/base64 @ ~1.4.0
  ;stevemarple/MicroNMEA @ ^2.0.6
  ;end2endzone/NonBlockingRTTTL@^1.3.0
  ; ---- Hybrid phone: pinned Reticulum stack (HYBRID_PLAN.md D8) ----
  ; SHAs mirror ../pyxis/platformio.ini, whose comments document each fix.
  ; Exactly ONE copy of each micro* lib may exist in libdeps.
  ; ORDER MATTERS: microStore's pin must precede microReticulum. PIO
  ; installs lib_deps top-down, and microReticulum's library.json
  ; declares microStore by bare URL (no rev) — if microReticulum
  ; installs first, it fetches an UNPINNED microStore HEAD under the
  ; name "microStore" and our pin lands as a duplicate "microStore@src-…"
  ; dir with ambiguous include-path ordering (observed 2026-07-22).
  ; With the pin first, microReticulum's dep resolves to the already-
  ; installed pinned copy. If a dir matching .pio/libdeps/*/microStore@src-*
  ; ever appears, the duplicate is back — fix the ordering, wipe libdeps.
  https://github.com/attermann/microStore.git#c5fb69d68229e684c7fbd17692a67ae8193b84e2
  https://github.com/torlando-tech/microReticulum.git#6054f6ba82367628a85cd07fcb668b95e947f046
  https://github.com/torlando-tech/microLXMF.git#3cdde79172af915c4e330be36ff9775550e57fa5
  bblanchon/ArduinoJson@^7.4.2
  hideakitai/MsgPack@^0.4.2
  rweather/Crypto@^0.4.0
  ; M3 voice: codec2 for LXST calls (carries modern codec2 since its
  ; PR #4, Jan 2026). __EMBEDDED__/MEMORY_CRITICAL below put its
  ; ~127KB of codebooks in flash instead of BSS.
  sh123/esp32_codec2@^1.0.7
  ; NOTE: do NOT list framework built-ins (WiFi/FS/LittleFS) here — doing
  ; so reprioritizes the LDF graph and broke SD_MMC's FS.h resolution
  ; (2026-07-22). The include scan links them fine on its own.

; File System configuration for uploading data
board_build.filesystem = littlefs
extra_scripts =
    pre:fix_lvgl_build.py
    ; Hybrid phone: libdeps patch steps ported from ../pyxis (see each
    ; script's docstring). msgpack: expose internals microLXMF needs;
    ; filestore: microStore FD-leak fix + log-spam silence; littlefs_paths:
    ; "/"-prefix normalization required by ESP32 LittleFS.
    pre:patch_msgpack.py
    pre:patch_filestore.py
    pre:patch_littlefs_paths.py
    ; codec2 state → PSRAM (measured ~20KB internal for enc+dec pair;
    ; see the script header for the on-device evidence)
    pre:patch_codec2_psram.py
    post:merge_bin.py
; extra_scripts = post:upload_data.py

; Release build: same firmware plus the data/ tree embedded as a compressed
; pack (pack/data_pack.bin) that the app extracts into LittleFS on first boot.
; This makes firmware.bin self-contained for the Launcher and web flashers.
; The default (dev) env skips the pack to keep uploads fast; release artifacts
; come from `pio run -e meshpunk_release`.
; Test-hooks build: the pyxis service task becomes the SOLE Serial line
; reader (T:<CMD> harness + forwards other lines to the MeshCore CLI);
; tdl_link's drain and the mesh CLI's own Serial read are compiled out.
; Production envs keep stock serial flow untouched (HYBRID_PLAN.md D11).
[env:meshpunk_test]
extends = env:meshpunk
build_flags =
    ${env:meshpunk.build_flags}
    -DHYBRID_TEST_HOOKS

[env:meshpunk_release]
extends = env:meshpunk
build_flags =
    ${env:meshpunk.build_flags}
    -DMESHPUNK_EMBED_PACK=1
board_build.embed_files = pack/data_pack.bin
; NOTE: PlatformIO REPLACES (does not merge) extra_scripts from the
; base env, so every pre-patch the base runs must be repeated here or
; the release libdeps build unpatched (msgpack private-member errors,
; unpatched filestore/codec2). Keep this list in sync with
; [env:meshpunk] extra_scripts, plus the release-only make_data_pack.
extra_scripts =
    pre:fix_lvgl_build.py
    pre:patch_msgpack.py
    pre:patch_filestore.py
    pre:patch_littlefs_paths.py
    pre:patch_codec2_psram.py
    pre:make_data_pack.py
    post:merge_bin.py

